[project]
name = "sec-financial-research-agent"
version = "0.1.0"
description = "Production-oriented financial research agent powered by public SEC EDGAR data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sai Navaneeth Thota" }]
dependencies = [
    "duckdb>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_financial_research"]

[project.scripts]
sec-research = "sec_financial_research.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
